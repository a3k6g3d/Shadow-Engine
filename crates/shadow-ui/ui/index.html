<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost">
<title>Shadow</title>
<style>
  :root { --bg: #090a0f; --surface: #12141c; --ink: #e2e8f0; --muted: #8492a6; --accent: #6366f1; --line: #222736; --danger: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; font-variant-numeric: tabular-nums; }
  main { width: min(620px, 92vw); text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.55); }
  .logo { margin-bottom: 14px; }
  .logo svg { width: 44px; height: 44px; fill: var(--accent); filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.35)); }
  h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 0 auto 20px; width: 240px; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
  .failed .bar { display: none; }
  .failed h1 { color: var(--danger); }
  pre { margin: 0 0 18px; padding: 12px 14px; text-align: left; background: rgba(9, 10, 15, 0.75);
        border: 1px solid var(--line); border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; color: var(--muted);
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; overflow-y: auto; user-select: text; }
  pre:empty { display: none; }
  .btns { display: flex; gap: 10px; justify-content: center; }
  button { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--line); color: var(--ink); font: inherit; cursor: pointer; transition: 0.15s; }
  button:hover { background: #2d3345; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: #4f46e5; }
  .btns[hidden] { display: none; }
</style>
</head>
<body>
<main id="main">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <h1 id="title">Connecting to Shadow</h1>
  <p class="sub" id="sub">Waiting for Shadow server to answer at http://127.0.0.1:8081...</p>
  <div class="bar"><i></i></div>
  <pre id="log"></pre>
  <div class="btns" id="btns" hidden>
    <button class="primary" id="retry">Try again</button>
    <button id="openlog">Open Log</button>
    <button id="quit">Quit</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const invoke = (cmd) => window.__TAURI__.core.invoke(cmd);
  $('retry').onclick = () => invoke('retry');
  $('openlog').onclick = () => invoke('open_log');
  $('quit').onclick = () => invoke('quit_app');
  window.__TAURI__.event.listen('status', (e) => {
    const s = e.payload;
    const failed = s.state === 'failed';
    $('main').className = failed ? 'failed' : '';
    $('btns').hidden = !failed;
    if (failed) {
      $('title').textContent = 'Shadow is not responding';
      $('sub').textContent = 'Could not connect to http://127.0.0.1:8081. Server log:';
    } else if (s.state === 'waiting') {
      $('title').textContent = 'Waiting for Shadow';
      $('sub').textContent = 'Launch Shadow with: shadow.exe serve <model.gguf> --port 8081 (' + s.secs + 's)';
    } else {
      $('title').textContent = 'Starting Shadow';
      $('sub').textContent = 'Loading the model into VRAM/RAM (' + s.secs + 's)...';
    }
    $('log').textContent = (s.lines || []).join('\n');
  });
</script>
</body>
</html>
