[package]
name = "shadow-host"
version.workspace = true
edition.workspace = true

# The runtime half of the plan, as opposed to shadow-abi's contract half.  No longer dependency-free: the scheduler
# layer (src/scheduler.rs, docs/SHADOW_PLAN.md Phase 1 item 1) needs a channel, a oneshot and a waker, and the ones
# tokio has are the ones a task on either side already speaks.  rt + sync are the layer; macros + time are the test.
# cdylib: shadow_host.dll, which the engine loads by absolute path (M5, src/ffi.rs).  A staticlib was measured and
# rejected - MSVC cannot link it without adding onecoreuap.lib to the engine.  rlib: the crate's own tests and the
# vertical slice still use it as a Rust library.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shadow-abi = { path = "../shadow-abi" }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
