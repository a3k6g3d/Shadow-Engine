[package]
name = "shadowzero-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

# The HTTP server (docs/SHADOW_PLAN.md, stage 4): hyper + serde_json, decided 2026-10-26.  hyper-util for the tokio
# glue, http-body-util for whole and streamed bodies, futures-util to turn the engine's channel into a body stream.

[dependencies]
shadowzero-model = { path = "../shadowzero-model" }
shadowzero-cuda = { path = "../shadowzero-cuda" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12"
futures-util = { version = "0.3.34", default-features = false }
serde_json = "1.0.151"
regex = "1"
# Remote pairing (docs/PLAN_APK_2026-11-13.md, Phase 1): the OS CSPRNG for the 4-digit pin and
# the 32-byte bearer token, and SHA-256 for the hashes kept on disk (pair.json holds the
# token's digest, never the token).  Both are in the local cargo cache already.
getrandom = "0.2"
sha2 = "0.10"
